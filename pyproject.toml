[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canonicalfp"
version = "0.1.0"
description = "Type-exact canonical fingerprints for Python values"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "linluozi"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
canonicalfp = "canonicalfp.cli:main"

[tool.setuptools]
packages = ["canonicalfp"]